<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>留言板</title>
</head>
<body>

<h2>🌸 留言板 🌸</h2>

<input id="name" placeholder="你的名字">
<br><br>
<textarea id="message" placeholder="留言內容"></textarea>
<br>
<button onclick="send()">送出留言</button>

<hr>

<div id="list"></div>

<script>
// 轉台灣時間
function toTaiwanTime(utcString) {
    return new Date(utcString).toLocaleString("zh-TW", { timeZone: "Asia/Taipei" });
}

// 載入留言
function loadMessages() {
    fetch("/list")
        .then(r => r.json())
        .then(list => {
            let html = "";
            list.forEach(item => {
                html += `
                <div style="border:1px solid #ccc; padding:10px; margin:10px;">
                    <b>${item.name}</b><br>
                    ${item.message}<br>
                    <small>${toTaiwanTime(item.created_at)}</small><br>
                    <button onclick="deleteMsg(${item.id})">刪除</button>
                </div>`;
            });
            document.getElementById("list").innerHTML = html;
        });
}

// 新增留言
function send() {
    fetch("/add", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            name: document.getElementById("name").value,
            message: document.getElementById("message").value
        })
    }).then(() => loadMessages());
}

// 假刪除
function deleteMsg(id) {
    fetch(`/delete/${id}`, { method: "POST" })
        .then(() => loadMessages());
}

loadMessages();
</script>

</body>
</html>
