<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌸留言板🌸</title>
<style>
  body {
    font-family: "微軟正黑體";
    background: linear-gradient(135deg, #fef6f9, #fcefe3);
    padding: 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  h1 {
    color: #ff8da1;
    margin-bottom: 20px;
    text-shadow: 1px 1px 2px #ffd4d9;
  }
  .board {
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 6px 20px rgba(255, 143, 160, 0.2);
    width: 90%;
    max-width: 600px;
    padding: 25px;
  }
  input, textarea {
    width: 100%;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid #ffd1dc;
    margin-bottom: 10px;
    font-size: 1em;
    outline: none;
  }
  button {
    background-color: #ffb6c1;
    color: white;
    padding: 10px 20px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-weight: bold;
    transition: 0.2s;
  }
  button:hover {
    background-color: #ff8da1;
  }
  .message {
    background: #fff9fb;
    border: 1px solid #ffe2eb;
    padding: 15px;
    border-radius: 15px;
    margin-top: 15px;
    box-shadow: 0 3px 8px rgba(255, 182, 193, 0.1);
    position: relative;
  }
  .delete-btn {
    position: absolute;
    right: 10px;
    top: 10px;
    background: none;
    border: none;
    font-size: 1.2em;
    color: #ff7b8a;
    cursor: pointer;
  }
  .name {
    font-weight: bold;
    color: #ff69b4;
  }
  .content {
    margin-top: 5px;
    color: #555;
  }
</style>
</head>
<body>

<h1>🌷 留言板 🌷</h1>

<div class="board">
  <input type="text" id="name" placeholder="你的名字">
  <textarea id="message" rows="4" placeholder="想說什麼都可以呦～(๑>◡<๑)♡"></textarea>
  <button onclick="addMessage()">送出留言</button>

  <div id="messages">
    {% for c in comments %}
    <div class="message comment-item">
      <button class="delete-btn" onclick="deleteMessage({{ c.id }})">✖</button>
      <div class="name">{{ c.name }}</div>
      <div class="content">{{ c.message }}</div>
    </div>
    {% endfor %}
  </div>
</div>

<script>
function addMessage() {
  const name = document.getElementById("name").value.trim();
  const message = document.getElementById("message").value.trim();

  if (!name || !message) {
    alert("請輸入名字與留言內容喔～♡");
    return;
  }

  fetch("/add_comment", {
    method: "POST",
    headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body: new URLSearchParams({ name, message })
  })
  .then(res => res.json())
  .then(data => {
    if (data.status === "success") {
      document.getElementById("name").value = "";
      document.getElementById("message").value = "";
      location.reload(); // 重新載入頁面顯示最新留言
    }
  });
}

function deleteMessage(id) {
  if (!confirm("你確定要刪除這則留言嗎？(´・ω・`)")) return;

  fetch(`/delete_comment/${id}`, { method: "POST" })
    .then(res => res.json())
    .then(data => {
      if (data.status === "deleted") {
        location.reload(); // 刪除後重新載入
      }
    });
}
</script>

</body>
</html>
